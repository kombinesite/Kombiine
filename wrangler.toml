name = "kombiine"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# O binding DB já está configurado no painel Cloudflare deste projeto.
# Mantê-lo gerenciado no painel evita substituir o Database ID real por um placeholder.
# Se migrar a gestão de bindings para este arquivo, adicione [[d1_databases]] com o ID real.


[vars]
ALLOWED_ORIGIN = "https://kombine.shop"
ALLOW_LOCAL = "false"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
