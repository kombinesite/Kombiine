
name = "kombiine"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# O binding D1 DB permanece configurado no painel Cloudflare.
# O código do Worker deve utilizar env.DB.

[vars]
ALLOWED_ORIGIN = "https://kombine.shop"
ALLOW_LOCAL = "false"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
